questions:
  - q: Cât fac împreună unghiurile unui triunghi?
    options:
      - 90°
      - 180°
      - 270°
      - 360°
    answer: 1
    why: "Orice triunghi are suma unghiurilor 180°. Încearcă în laborator: oricum ai trage colțurile, suma rămâne aceeași."
    stars: 1
  - q: Legea sinusurilor spune că a / sin A este egal cu…
    options:
      - a · b
      - sin B / b
      - "1"
      - b / sin B
    answer: 3
    why: a / sin A = b / sin B = c / sin C. Toate trei sunt egale cu 2R, diametrul cercului circumscris.
    stars: 1
  - q: În legea cosinusurilor a² = b² + c² − 2bc·cos A, ce se întâmplă dacă A = 90°?
    options:
      - rămâne teorema lui Pitagora
      - a devine 0
      - formula nu mai merge
      - a² = 2bc
    answer: 0
    why: "cos 90° = 0, deci termenul 2bc·cos A dispare: a² = b² + c²."
    stars: 2
  - q: Două laturi au 6 și 10, iar unghiul dintre ele are 30°. Care este aria? (sin 30° = ½)
    options:
      - "30"
      - "60"
      - "15"
      - 7,5
    answer: 2
    why: Aria = ½ · 6 · 10 · sin 30° = ½ · 60 · ½ = 15.
    stars: 2
  - q: Formula lui Heron calculează aria știind…
    options:
      - două laturi și un unghi
      - doar cele trei laturi
      - doar unghiurile
      - înălțimea
    answer: 1
    why: Aria = √(s(s−a)(s−b)(s−c)), unde s este semiperimetrul. Nu ai nevoie de niciun unghi.
    stars: 2
  - q: "Triunghiul 3-4-5: s = 6. Care este raza cercului înscris, r? (Aria = 6)"
    options:
      - "2"
      - 2,5
      - 0,5
      - "1"
    answer: 3
    why: Aria = r · s, deci r = Aria / s = 6 / 6 = 1.
    stars: 3
bonus:
  - q: De ce, la un triunghi dreptunghic, centrul cercului circumscris este chiar la mijlocul ipotenuzei?
    a: "Un unghi înscris într-un semicerc este drept. Invers, dacă unghiul C este drept, ipotenuza AB este un diametru. În formule: c / sin 90° = c = 2R."
